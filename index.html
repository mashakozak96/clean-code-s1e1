<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="header image">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="add-item" id="add-item">
        <label class="add-item__label" for="new-task">Add Item</label>
        <div class="add-item__wrapper">
          <input id="new-task"class="add-item__input input task" type="text">
          <button class="add-item__btn btn">Add</button>
        </div>
      </section>
      <section class="todo">
        <h3 class="todo__title title">Todo</h3>
        <ul class="todo__list list" id="incomplete-tasks">
          <li class="list__item item">
            <input class="item__checkbox input" type="checkbox">
            <label class="task item__label">Pay Bills</label>
            <input type="text" class="item__input task input">
            <button class="item__edit btn">Edit</button>
            <button class="item__delete btn">
              <img class="btn__img" src="./remove.svg" alt="remove image">
            </button>
          </li>
          <li class="list__item item edit-mode">
            <input type="checkbox" class="item__checkbox input">
            <label class="task item__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="item__input task input">
            <button class="item__edit btn">Save</button>
            <button class="item__delete btn">
              <img class="btn__img" src="./remove.svg" alt="remove image">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed-tasks">
        <h3 class="title completed-tasks__title">Completed</h3>
        <ul id="completed-tasks" class="list completed-tasks__list">
          <li class="list__item item">
            <input class="item__checkbox input" type="checkbox" checked>
            <label class="item__label task">See the Doctor</label>
            <input type="text" class="item__input task input">
            <button class="item__edit btn">Edit</button>
            <button class="item__delete btn">
              <img class="btn__img" src="./remove.svg" alt="remove image">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
